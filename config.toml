# 옛날바람 주술사 매크로 설정 (macOS)

[hotkeys]            # 게임 창이 맨 앞일 때만 동작
keys = "f8"          # 키매크로 켜기/끄기 (F10은 게임 옵션이라 피함)
auto = "f9"          # 자동사냥 켜기/끄기
quit = "f7"          # 프로그램 종료 (F12는 게임의 부드러운 이동 켜기/끄기라 피함)

[window]
app = "MapleStory Worlds"

[bars]               # 게임 창 왼쪽 위 모서리 기준 픽셀 좌표 (창 크기 1920x1050 기준)
x0 = 1583            # 바 왼쪽 끝
x1 = 1764            # 바 오른쪽 끝 (바는 여기에 붙어 있고 왼쪽부터 줄어듦)
hp_y = 880           # 체력바 가운데 줄
mp_y = 906           # 마력바 가운데 줄
half_height = 5      # 가운데 줄에서 위아래로 볼 픽셀 수

[regions]            # 바뀌었는지만 비교하는 화면 영역 [x, y, 너비, 높이] (게임 창 기준)
coordinates = [1570, 970, 190, 26]    # 오른쪽 아래 캐릭터 좌표
last_message = [1392, 776, 360, 22]   # 메시지 창의 맨 아랫줄
map_name = [640, 62, 240, 26]        # 화면 위 가운데 맵 이름
messages = [1390, 690, 370, 110]     # 오른쪽 메시지 창 (살펴보기 결과, 주운 아이템이 찍힌다)
view = [157, 85, 1198, 720]          # 맵이 보이는 게임 화면
input_line = [750, 980, 40, 10]       # 화면 아래 입력줄. 대상 선택창/채팅창이 열리면 흰색

[timing]
key_hold = 0.02      # 키를 누르고 있는 시간(초)
modifier_hold = 0.06 # Shift/Ctrl을 누른 뒤 본 키를 누르기까지의 시간(초)
key_delay = 0.08     # 키 입력 사이 간격(초). 스킬이 씹히면 0.1로 올리세요

[keys]               # 게임 내 스킬 단축키
poison = ""          # 중독
heal = "2"           # 힐 (타겟팅: 나에게)
attack1 = "1"        # 첨사냥 1
gongjeung = "5"      # 공력증강
bomu1 = "6"          # 보호
bomu2 = "7"          # 무장
mabi = ""            # 마비. 숫자키에 없음. "" 이면 안 씀
attack2 = "3"        # 첨사냥 2
curse = "4"          # 저주
ranged = ["shift+z", "s"]   # 대상 지정 공격(극진화열참주). Shift+Z → 슬롯 글자. [] 이면 안 씀
gate = ["shift+z", "k"]     # 비영사천문 (성 안에서 동서남북 문으로 순간이동). [] 이면 안 씀
revive = ["shift+z", "l"]   # 성황령 (죽은 뒤 성황당으로 간다). [] 이면 죽었을 때 그냥 끝낸다
hellfire = "9"       # 헬파이어 (대상 지정, 마력 전부 소모). "" 이면 안 씀
basic = "space"      # 기본 공격. 싸우는 동안 누른 채로 두고 스킬과 같이 쓴다 (무기의 격이 일정 확률로 나간다). "" 이면 안 씀
potion = "ctrl+z"    # 마나물약 (Ctrl + 아이템 슬롯 글자). 떨어지면 게임이 다음 동동주로 넘겨준다
pickup = "shift+,"     # 내가 선 칸의 아이템을 줍는다. ","만 누르면 하나만, Shift와 같이 누르면 그 칸의 것을 다 줍는다
look = ";"             # 바라보는 앞 칸에 있는 것(몹, 아이템)의 이름을 메시지 창에 찍는다. 빈 칸이면 아무것도 안 찍힌다

[auto]                # 위에서부터 우선순위 순서. 해당하는 게 없으면 공격
potion_below = 0.02   # 마력이 이 아래면 바닥으로 본다 (힐도 못 쓴다). 공력증강 전에 동동주 1잔을 마신다

hp_low = 0.60         # 체력이 이 비율 아래면 힐 시작
hp_ok = 0.90          # 이 비율까지 차면 힐 중단

mp_low = 0.10         # 마력이 이 비율 아래면 공력증강 (가득 채워 주므로 거의 바닥났을 때만 쓰면 된다)
gongjeung_min_hp = 0.60   # 공력증강은 체력이 이 이상일 때만 (지금 체력의 60~70%를 깎는다. 누른 직후 힐로 메운다)
gongjeung_wait = 0.5  # 공력증강 후 바가 바뀔 때까지 기다리는 시간(초)
potions_per_try = 1   # 공력증강 전에 마실 동동주 수. 동동주 1잔 = 마력 30 = 공력증강 1번 값
refill_tries = 4      # 공력증강은 실패할 수 있다. 물약 → 공력증강을 다시 해보는 최대 횟수

bomu_every = 170      # 보무 주기(초). 보호와 무장은 3분쯤 간다. 0이면 안 씀
curse_every = 300     # 저주 주기(초). 0이면 안 씀
curse_seconds = 2     # 저주를 돌리는 시간(초)
poison_every = 20     # 중독을 다시 거는 주기(초). 중독은 30초쯤 간다. 체력을 비율로 깎으므로 못 때린 몹에게 미리 건다
poison_seconds = 2    # 중독을 돌리는 시간(초)

hellfire_every = 6    # 헬파이어 재사용 대기(초)
hellfire_retry = 1    # 헬파이어가 안 나갔을 때 다시 시도하기까지(초)
hellfire_range = 99   # 이 칸 수 안에 있는 몹에게 헬파이어를 쓴다 (가로·세로 중 큰 쪽). 1 = 붙은 몹에게만
hellfire_min_mp = 0.50  # 마력이 이 이상일 때 헬파이어 (남은 마력에 비례해 세다). 모자라면 체력이 될 때 공력증강으로 채운다
hellfire_target_hp = 0.5  # 체력이 이 이상 남은 몹(또는 아직 안 맞은 몹)에게 우선 쓴다
target_tries = 6      # 대상 선택창에서 ←로 넘겨볼 최대 횟수
hellfire_min_hp = 0     # 헬파이어를 쓰는 데 체력은 필요 없다. 0 = 체력을 따지지 않는다
cast_wait = 0.3       # 대상 지정 스킬을 쓴 뒤 메시지가 찍히길 기다리는 시간(초)

attack_gap = 0.4      # 첨사냥 1 → 2 사이 간격(초)
attack_interval = 0.3 # 첨사냥 2 → 다음 1 사이 간격(초)

[roam]                # 앞에 몹이 없으면 찾아 나서기
enabled = true
misses = 2            # 공격이 연속으로 이만큼 안 나가면 몹을 찾는다
steps = 4             # 한 번에 걸어가는 칸 수 (막히면 방향을 바꿈)
step_wait = 0.25      # 한 칸 이동 후 좌표가 바뀌길 기다리는 시간(초)
radius = 5            # 자동사냥을 켠 자리에서 이 칸 수보다 멀리 가지 않는다
map_wait = 1.0        # 맵이 바뀐 뒤 화면이 뜨길 기다리는 시간(초)

[hunt]                # hunt.py: 굴의 방을 차례로 지나가며 사냥
scan_every = 3        # 이 걸음 수마다 화면에 몹이 있는지 본다
targets = 5           # 저주/중독을 한 번에 걸어 볼 몹 수
curse_every = 90      # 한자리에서 싸울 때 저주를 다시 거는 주기(초). 저주는 3분쯤 가지만 새 몹이 다가온다
curse_after_steps = 8 # 저주를 건 뒤 이만큼 걸었으면 새 몹을 만난 것으로 보고 다시 건다
poison_every = 20     # 중독을 다시 거는 주기(초). 중독은 30초쯤 간다. 체력을 비율로 깎으므로 못 때린 몹에게 미리 건다
approach_max = 0      # 0보다 크면: 붙은 몹이 없을 때 이 칸 수 안의 몹에게 걸어가서 싸운다. 0이면 쫓아가지 않고 갈 길을 간다
adjacent = 3          # 몹이 가까이에 이만큼 따라왔을 때만 멈춰서 싸운다 (길이 막혔을 때는 예외로 싸운다)
near = 4              # "가까이"의 칸 수 (대각선 포함). 걷는 동안 따라오는 몹은 한두 칸 뒤에 있다
gather_hp = 0.70      # 걷는 중 체력이 이 아래로 내려가면 붙은 몹 수와 상관없이 멈춰서 싸운다
danger_hp = 0.25      # 체력이 이 아래면 로그에 남기고 헬파이어도 미룬다
hellfire_refill_hp = 0.60  # 헬파이어를 쓸 차례인데 마력이 모자랄 때, 체력이 이 이상이면 공력증강으로 채우고 쓴다
heal_to = 0.80        # 체력이 hp_low 아래로 내려가면 이만큼 찰 때까지 힐을 이어서 쓴다
clear_checks = 2      # 연달아 이만큼 몹이 안 잡혀야 다 잡은 것으로 본다
# 계속 돌려 누를 스킬키 (첨, 힐, 첨, 저주). 기본 공격을 누른 채로 쉬지 않고 누른다. 비우면 안 쓴다
spam_keys = ["1", "2", "3", "4"]
spam_gap = 0.01      # 키 사이 쉬는 시간(초)
fast_mp_low = 0.30   # 계속 누르는 방식에서 마력이 이 아래면 공력증강 (체력은 안 본다)
fast_hellfire_hp = 0.5  # 계속 누르는 방식에서 체력이 이 이상일 때만 헬파이어를 쓴다 (쓰는 1.5초 동안 힐이 끊긴다)
scan_gap = 3.0       # 고정을 풀고 몹을 다시 보는 간격(초). 이때 방향을 다시 잡고 헬파이어 차례면 쓴다
look_gap = 1.5       # 쿨 중에 앞 칸의 몹이 그대로인지 살펴보는 간격(초). 그대로면 선택창을 안 연다
probe_every = 1.0    # 첨이 닿는지(몹이 남았는지) 보는 간격(초)
spam_rounds = 4      # 한 바퀴에 몇 번 돌려 누를지 (그 뒤 헬파이어/공력증강/방향을 다시 본다)
